# Every check, on every push, on a made-up farm (tests/farm). The parts run side by side; "All checks" is the one result to
# require before a merge (a run started by dispatch says it as a commit status too: the job "counted", at the foot). It also
# prints what every check ran, as tests/counts.json would hold it, and keeps it as "counts".
# How to run the same thing on your own computer: tests/README.md.
name: Checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  part:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [node, build, app1, app2, app3, app4, new, "off", site1, site2, site3, site4, site5, site6, site7, site8, site9, site10, screens]
    env:
      LRF_WORK: ${{ github.workspace }}/../lrf-work
      # on main the build before is what main was before this push; on a branch setup.sh finds where the branch left main
      LRF_BASE: ${{ github.ref == 'refs/heads/main' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build before is read from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install --quiet playwright==1.63.0 pillow==12.3.0   # said outright: a newer driver or drawing library is a change like any other
          google-chrome --version
      - name: Work folder
        run: sh tests/setup.sh
      - name: Run
        env:
          LRF_SHOTS: ${{ runner.temp }}/shots     # the pictures the checks take: a place that can be kept with the run
        run: sh tests/run.sh ${{ matrix.part }} 2>&1 | tee "$RUNNER_TEMP/part.log"   # kept outside the repository: the site serves every file at its root
      - name: Verdict
        run: python3 -I tests/verdict.py "$RUNNER_TEMP/part.log" ${{ matrix.part }} "$RUNNER_TEMP/ran/ran-${{ matrix.part }}.json"
      - name: Keep what each check of this part ran, for tests/counts.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ran-${{ matrix.part }}
          path: ${{ runner.temp }}/ran
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the pictures of the screens that changed
        if: always() && matrix.part == 'screens'
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/shots/screens
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the pictures of a part that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.part }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
  # The linter reads the scripts and runs none of them: seconds, on every push. Its rules, and how to run it by hand, are in
  # tools/eslint.config.mjs. The versions are said outright, as the browser's driver is above.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: npm install --no-save --no-package-lock eslint@9.39.5 @eslint/js@9.39.5 globals@16.5.0
      - name: Lint
        run: npx eslint -c tools/eslint.config.mjs js
  all:
    name: All checks
    if: always()
    needs: [part, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Every part passed
        run: test "${{ needs.part.result }}" = "success" && test "${{ needs.lint.result }}" = "success"
      # bookkeeping, after the verdict and unable to change it: what every check ran, as tests/counts.json would hold it
      - uses: actions/checkout@v4
        if: always()
        continue-on-error: true
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: ran-*
          path: ran
          merge-multiple: true
      - name: What every check ran, as tests/counts.json would hold it
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 -I tests/counts.py ran | tee counts.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: counts
          path: counts.json
          if-no-files-found: ignore
          retention-days: 7
  # A run started with workflow_dispatch (by "Take main in", whose push starts no workflow, or by hand from the Actions page) is
  # not counted by the protection of main, though "All checks" passes on the very commit: GitHub weighs the checks of a workflow's
  # jobs for a pull request only when the run was started by a push, a pull request or a few other events, never by
  # workflow_dispatch (GitHub's documentation, "Troubleshooting required status checks", "Checks from some workflow jobs are not
  # evaluated"). So such a run also says "All checks" on the commit it checked as a commit status, which the protection does
  # count, with the outcome of the job "All checks". A run started by a push says nothing more: its own "All checks" is counted.
  # This job runs nothing of any branch (no checkout, no action): it reads one outcome and writes one status. A run cancelled
  # says nothing, and leaves the commit as an earlier run left it. tests/take_main_job_test.cjs holds it to this.
  counted:
    name: All checks, as a status
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: all
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Say "All checks" on the commit checked, as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.all.result }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; said="Every part and lint passed"; else state=failure; said="A part or lint did not pass ($OUTCOME)"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="All checks" \
            -f description="$said, in a run started by hand or by Take main in" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
