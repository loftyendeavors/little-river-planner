# When main moves, every open pull request from this repository takes it in by itself (tools/take_main.cjs): js/built.js, sw.js
# and the site written again, tests/counts.json joined check by check, the next label given. A pull request whose code conflicts
# with main is left as it was, and a comment names the files to settle by hand. It can be started by hand for one branch too.
#
# Three jobs, so that no code from a branch runs where there is a key that can write:
#   list   reads the open pull requests, with a key that can only read them
#   take   takes main into each branch with no key at all. The merge runs the branch's own helpers (tools/shared.cjs and what it
#          calls, tests/counts.py), so this is the branch's code running. What it makes is handed on as a git bundle and a list
#          of outcomes: data, which the next job reads and never runs
#   send   for each pull request of the list (its number, branch and commit taken from "list", not from what "take" handed on),
#          pushes the commit "take" made, only onto the commit the branch was read at (--force-with-lease: a chat's push since
#          then wins), starts the checks for it, and says on the pull request what was done. It runs nothing of any branch
# A push made with this workflow's key starts no workflow by itself, so the checks are started for the branch here: "All checks"
# on its newest commit is still what a merge waits for. How it fits with a chat that is building: tests/README.md, "Two builds
# side by side". tests/take_main_job_test.cjs holds the three jobs to this.
name: Take main in
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: The branch of an open pull request (empty for every one)
        required: false
permissions: {}
concurrency:
  group: take-main
  cancel-in-progress: false
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: The open pull requests from this repository
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ github.event.inputs.branch }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,headRefName,headRefOid,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not) | select(env.ONLY == "" or .headRefName == env.ONLY) | {number, branch: .headRefName, at: .headRefOid}]' > prs.json
          cat prs.json
          echo "prs=$(jq -c . prs.json)" >> "$GITHUB_OUTPUT"
  take:
    needs: list
    if: needs.list.outputs.prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # no key is left behind for a branch's code to find
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typefaces for the built site
        run: |
          mkdir -p "$RUNNER_TEMP/scratch" && cd "$RUNNER_TEMP/scratch"
          npm i --no-audit --no-fund --silent @fontsource-variable/bricolage-grotesque @fontsource-variable/instrument-sans @fontsource-variable/jetbrains-mono
      - name: Each branch takes main in, with no key
        shell: bash
        env:
          PRS: ${{ needs.list.outputs.prs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FONTS="$RUNNER_TEMP/scratch/node_modules/@fontsource-variable"
          # the tool as main has it, run on each branch: a branch's own copy may be older, changed, or not there at all
          TOOL="$RUNNER_TEMP/take_main.cjs"; cp tools/take_main.cjs "$TOOL"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"; : > "$OUT/outcomes.jsonl"
          git rev-parse --short origin/main > "$OUT/main"
          printf '%s' "$PRS" | jq -c '.[]' > "$RUNNER_TEMP/prs.jsonl"
          while read -r pr; do
            number=$(printf '%s' "$pr" | jq -r .number); at=$(printf '%s' "$pr" | jq -r .at)
            echo "== #$number"
            git reset -q --hard && git clean -qfd
            if ! git checkout -q -B "take/$number" "$at"; then
              jq -nc --argjson n "$number" '{number: $n, code: 1, head: "", said: "the branch could not be read"}' >> "$OUT/outcomes.jsonl"; continue
            fi
            set +e
            out=$(node "$TOOL" . "$FONTS" --commit --abort 2>&1); code=$?
            set -e
            echo "$out"
            jq -nc --argjson n "$number" --arg head "$(git rev-parse HEAD)" --argjson code "$code" --arg said "$(printf '%s\n' "$out" | tail -1)" \
              '{number: $n, head: $head, code: $code, said: $said}' >> "$OUT/outcomes.jsonl"
          done < "$RUNNER_TEMP/prs.jsonl"
          refs=$(git for-each-ref --format='%(refname)' 'refs/heads/take/*')
          if [ -n "$refs" ]; then git bundle create "$OUT/taken.bundle" $refs; fi
      - uses: actions/upload-artifact@v4
        with:
          name: taken
          path: ${{ runner.temp }}/out
          retention-days: 3
  send:
    needs: [list, take]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write         # to push the taking in to the pull request's branch
      pull-requests: write    # to say on the pull request what was done
      actions: write          # to start the checks for the branch
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: README.md   # the repository to push from: nothing of it is run here
      - uses: actions/download-artifact@v4
        with:
          name: taken
          path: ${{ runner.temp }}/in
      - name: Push, start the checks, and say so
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ needs.list.outputs.prs }}
        run: |
          IN="$RUNNER_TEMP/in"; main=$(head -c 12 "$IN/main" | tr -cd '0-9a-f')
          if [ -f "$IN/taken.bundle" ]; then git fetch -q "$IN/taken.bundle" 'refs/heads/take/*:refs/take/*' || true; fi
          printf '%s' "$PRS" | jq -c '.[]' > "$RUNNER_TEMP/prs.jsonl"
          while read -r pr; do
            # from the list: trusted. From what "take" handed on: only the commit it made, its exit code and what it said
            number=$(printf '%s' "$pr" | jq -r .number); branch=$(printf '%s' "$pr" | jq -r .branch); at=$(printf '%s' "$pr" | jq -r .at)
            line=$(jq -c --argjson n "$number" 'select(.number == $n)' "$IN/outcomes.jsonl" 2>/dev/null | head -1)
            code=$(printf '%s' "$line" | jq -r '.code // 1' 2>/dev/null || echo 1); said=$(printf '%s' "$line" | jq -r '.said // "no outcome was handed on"' 2>/dev/null || echo "no outcome was handed on")
            made=$(git rev-parse -q --verify "refs/take/$number" || true)
            body="$RUNNER_TEMP/body-$number.md"; rm -f "$body"
            if [ "$code" = 0 ] && [ -n "$made" ] && [ "$made" != "$at" ]; then
              if git -c core.hooksPath=/dev/null push --no-verify -q --force-with-lease="refs/heads/$branch:$at" origin "$made:refs/heads/$branch"; then
                gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" || echo "::warning::#$number: the checks could not be started"
                label=$(printf '%s' "$said" | jq -r '.label // "?"' 2>/dev/null || echo "?"); both=$(printf '%s' "$said" | jq -r '(.counts // []) | join(", ")' 2>/dev/null || true)
                printf 'main (%s) was taken into this branch by itself (`tools/take_main.cjs`): the label is now %s.%s The checks are running again on the two together. Pull the branch before your next push.\n' "$main" "$label" "${both:+ The counts of $both were changed on both sides and are to be confirmed by the run.}" > "$body"
              else
                printf 'main (%s) was taken into this branch, but the push was refused: the branch moved meanwhile, or the taking in brings a change to a workflow file, which cannot be pushed from here. Take it in by hand: `node tools/take_main.cjs . <fonts> --commit` (tests/README.md, "Two builds side by side").\n' "$main" > "$body"
              fi
            elif [ "$code" = 3 ]; then
              files=$(printf '%s' "$said" | jq -r '(.conflicts // []) | join(", ")' 2>/dev/null || echo "some files")
              printf 'main (%s) could not be taken into this branch by itself: %s conflict in the code, not in the files the merge writes. Settle them by hand (tests/README.md, "Two builds side by side"). Nothing was pushed.\n' "$main" "$files" > "$body"
            elif [ "$code" != 0 ]; then
              printf 'main (%s) could not be taken into this branch by itself, and nothing was pushed:\n\n```\n%s\n```\n\nTake it in by hand (tests/README.md, "Two builds side by side").\n' "$main" "$(printf '%s' "$said" | cut -c1-600 | tr -d '`')" > "$body"
            fi
            if [ -f "$body" ]; then gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" || echo "::warning::#$number: the comment could not be posted"; fi
          done < "$RUNNER_TEMP/prs.jsonl"
